[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "zen-vcache-ai"
version = "2.1.0"
description = "Zen 4/5 3D V-Cache microarchitectural benchmarks, L3 residency tools, and hybrid MoE / SIMD kernels"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
    { name = "Simonez & Arci", email = "arcicml@gmail.com" }
]
keywords = ["vcache", "3d-vcache", "zen4", "speculative-decoding", "avx512", "llm"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: POSIX :: Linux",
    "Topic :: System :: Hardware",
]

[project.scripts]
vcache-spec-bench = "vcache.benchmark:main"
vcache-vector-bench = "vcache.vector:main"
vcache-topology = "vcache.topology:main"

[tool.setuptools.packages.find]
where = ["src"]
